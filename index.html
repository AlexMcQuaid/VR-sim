
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Functional Vision Simulator v8</title>
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
<style>
body {
  margin:0;
  background:#15191d;
  color:white;
  font-family:system-ui,sans-serif;
}
#panel {
  position:fixed;
  top:12px;
  left:12px;
  z-index:20;
  background:#17212bed;
  padding:15px;
  border-radius:12px;
  width:300px;
  max-width:calc(100vw - 54px);
}
label {display:block;margin:12px 0}
input[type=range] {width:100%}
button {
  border:0;
  border-radius:7px;
  padding:10px;
  font:inherit;
  cursor:pointer;
}
.modeButtons {
  display:flex;
  gap:8px;
  margin:12px 0;
}
.modeButtons button {
  flex:1;
  background:#467fa9;
  color:white;
}
#toggle {
  background:#a94f4f;
  color:white;
}
.small {
  font-size:12px;
  color:#d0d8de;
  margin-top:9px;
}
#status {margin-top:10px;font-weight:bold}
</style>
</head>
<body>

<div id="panel">
  <strong>Functional Vision Simulator v8</strong>
  <div class="small">Residential environment</div>

  <div class="modeButtons">
    <button id="enterVR">Enter VR</button>
    <button id="enterAR">Enter AR</button>
  </div>

  <label>
    Viewing distance:
    <span id="distVal">0.5 m</span>
    <input id="dist" type="range"
      min="0.3" max="2" step="0.1" value="0.5">
  </label>

  <label>
    Peripheral field:
    <span id="fieldVal">100%</span>
    <input id="field" type="range"
      min="20" max="100" step="5" value="100">
  </label>

  <label>
    <input id="glare" type="checkbox">
    Strong glare
  </label>

  <label>
    <input id="motion" type="checkbox" checked>
    Moving person (VR)
  </label>

  <div id="browserLighting">
    <strong>Room lighting</strong>
    <div class="modeButtons">
      <button data-light="morning">Morning</button>
      <button data-light="day">Day</button>
    </div>
    <div class="modeButtons">
      <button data-light="dusk">Dusk</button>
      <button data-light="night">Night</button>
    </div>
  </div>

  <button id="toggle">Simulation OFF</button>

  <div id="status">SIMULATION ON</div>
  <div id="modeStatus" class="small">
    Browser preview
  </div>
  <div id="lightingStatus" class="small">
    Lighting: Day
  </div>
  <div class="small">
    Left wrist: settings.
    Right index finger: touch controls.
  </div>
</div>

<a-scene
  renderer="antialias:true;colorManagement:true;alpha:true"
  background="color:#b8cbd5"
  xr-mode-ui="enabled:false"
  webxr="optionalFeatures:hand-tracking,local-floor,bounded-floor">

  <!-- VR ENVIRONMENT -->
  <a-entity id="virtualRoom">

    <!-- ROOM LIGHTING -->
    <a-entity id="ambientLight"
      light="type:ambient;color:#fff;intensity:0.85">
    </a-entity>

    <a-entity id="sunLight"
      position="-3 4 -1"
      light="type:directional;color:#fff;intensity:1.1;castShadow:false">
    </a-entity>

    <a-entity id="ceilingLight"
      position="0 2.8 -1.5"
      light="type:point;color:#fff1d8;intensity:0;distance:7">
    </a-entity>

    <a-entity id="floorLampLight"
      position="2.25 1.65 -2.6"
      light="type:point;color:#ffe0a0;intensity:0;distance:4">
    </a-entity>

    <!-- FLOOR -->
    <a-plane
      rotation="-90 0 0"
      width="8" height="8"
      color="#927b65"
      material="roughness:0.9">

    <!-- FLOORBOARD SEAMS -->
    <a-entity id="floorboards"></a-entity>

    <!-- WALLS -->
    <a-plane
      position="0 1.6 -4"
      width="8" height="3.2"
      color="#d7d0c5">
    </a-plane>

    <a-plane
      position="-4 1.6 0"
      rotation="0 90 0"
      width="8" height="3.2"
      color="#d7d0c5">
    </a-plane>

    <a-plane
      position="4 1.6 0"
      rotation="0 -90 0"
      width="8" height="3.2"
      color="#d7d0c5">
    </a-plane>

    <a-plane
      position="0 3.2 0"
      rotation="90 0 0"
      width="8" height="8"
      color="#f4f0e8">
    </a-plane>

    <!-- BASEBOARDS -->
    <a-box position="0 0.09 -3.95"
      width="8" height="0.18" depth="0.045"
      color="#f4f0e8"></a-box>

    <a-box position="-3.95 0.09 0"
      width="0.045" height="0.18" depth="8"
      color="#f4f0e8"></a-box>

    <a-box position="3.95 0.09 0"
      width="0.045" height="0.18" depth="8"
      color="#f4f0e8"></a-box>

    <!-- WINDOW -->

      <a-plane id="windowGlass"

        color="#8db8d0">
      </a-plane>

      <a-box position="0 0 0.035"
        width="2.28" height="0.065"
        depth="0.07" color="#fff9ee">
      </a-box>

      <a-box position="0 0 0.035"
        width="0.065" height="1.57"
        depth="0.07" color="#fff9ee">
      </a-box>

      <a-box position="-1.13 0 0.035"
        width="0.08" height="1.6"
        depth="0.07" color="#fff9ee">
      </a-box>

      <a-box position="1.13 0 0.035"
        width="0.08" height="1.6"
        depth="0.07" color="#fff9ee">
      </a-box>

      <a-box position="0 0.78 0.035"
        width="2.34" height="0.08"
        depth="0.09" color="#fff9ee">
      </a-box>

      <a-box position="0 -0.78 0.08"

      <!-- CURTAINS -->
      <a-box position="-1.27 0 0.13"

        depth="0.11" color="#a7b0a0">
      </a-box>

      <a-box position="1.27 0 0.13"
        width="0.26" height="1.75"
        depth="0.11" color="#a7b0a0">
      </a-box>

      <a-cylinder

        rotation="0 0 90"

    </a-entity>

    <!-- RUG -->

      <a-box position="0 0.83 -0.34"

      </a-box>

      <a-box position="-1.09 0.60 0"
        width="0.25" height="0.56"
        depth="0.93" color="#596b63">
      </a-box>

      <a-box position="1.09 0.60 0"
        width="0.25" height="0.56"
        depth="0.93" color="#596b63">
      </a-box>

      <!-- SEAT CUSHIONS -->
      <a-box position="-0.51 0.64 0.12"
        width="0.98" height="0.13"
        depth="0.67" color="#73857b">
      </a-box>

      <a-box position="0.51 0.64 0.12"
        width="0.98" height="0.13"
        depth="0.67" color="#73857b">
      </a-box>

      <!-- BACK CUSHIONS -->
      <a-box position="-0.5 0.97 -0.23"
        width="0.94" height="0.48"

      </a-box>

      <a-box position="0.5 0.97 -0.23"
        width="0.94" height="0.48"
        depth="0.16" color="#718278">
      </a-box>

      <!-- THROW PILLOWS -->
      <a-box

    <!-- COFFEE TABLE -->

      <a-box position="-0.66 0.22 -0.27"

      <a-box position="0.66 0.22 -0.27"

      </a-box>

      <a-box position="-0.66 0.22 0.27"
        width="0.09" height="0.44"
        depth="0.09" color="#513b2c">
      </a-box>

      <a-box position="0.66 0.22 0.27"
        width="0.09" height="0.44"

      </a-box>

      <!-- INTERACTIVE MUG -->
      <a-entity id="mug"

      <!-- INTERACTIVE REMOTE -->
      <a-entity id="remote"
        position="-0.37 0.54 0.13"

        <a-box
          width="0.095" height="0.035"
          depth="0.23"

        </a-box>

        <a-cylinder
          position="0 0.022 -0.07"
          radius="0.017" height="0.007"
          color="#c74d4d">
        </a-cylinder>

        <a-cylinder
          position="0 0.022 0"
          radius="0.025" height="0.007"
          color="#777">
        </a-cylinder>
      </a-entity>

      <!-- BOOK -->
      <a-entity id="book"
        position="0 0.54 0.05"
        vision-target pinch-grabbable>

        <a-box
          width="0.25" height="0.035"
          depth="0.33"
          color="#365b70">
        </a-box>

        <a-box position="0 0.019 0"
          width="0.22" height="0.005"
          depth="0.29"
          color="#e8e0cb">
        </a-box>
      </a-entity>
    </a-entity>

    <!-- TV STAND -->
    <a-entity position="0 0 1.15">

      <a-box position="0 0.37 0"
        width="2.1" height="0.65"
        depth="0.43" color="#65503f">
      </a-box>

      <a-box position="0 0.71 0"

      </a-box>

      <a-box position="0 1.28 0.03"

      </a-box>

      <a-plane position="0 1.28 -0.012"

      </a-plane>

      <a-box position="0 0.83 0.02"
        width="0.10" height="0.18"

      </a-box>
    </a-entity>

    <!-- SIDE TABLE -->
    <a-entity position="2.05 0 -2.65">
      <a-cylinder position="0 0.53 0"
        radius="0.32" height="0.07"
        color="#795a41">
      </a-cylinder>

      <a-cylinder position="0 0.27 0"
        radius="0.055" height="0.52"

      </a-cylinder>

      <a-cylinder position="0 0.04 0"

        color="#5a4535">
      </a-cylinder>
    </a-entity>

    <!-- FLOOR LAMP -->
    <a-entity id="lamp"

    <!-- BOOKSHELF -->

        depth="0.43" color="#74543e">
      </a-box>

      <a-box position="0 1.96 0"
        width="1.3" height="0.07"
        depth="0.43" color="#74543e">
      </a-box>

      <a-entity id="shelfBooks"></a-entity>
    </a-entity>

    <!-- PLANT -->

      <a-cylinder position="0 0.22 0"
        radius-bottom="0.22"
        radius-top="0.29"
        height="0.44"
        color="#b17a58">
      </a-cylinder>

      <a-cylinder position="0 0.78 0"

  <!-- HAND TRACKING -->
  <a-entity id="leftHand"
    hand-tracking-controls="hand:left;modelStyle:mesh">
  </a-entity>

  <a-entity id="rightHand"
    hand-tracking-controls="hand:right;modelStyle:mesh">
  </a-entity>

  <!-- CAMERA AND VISION EFFECTS -->
  <a-entity id="rig">
    <a-camera id="cam"
      position="0 1.6 0"
      look-controls
      wasd-controls>

      <a-plane id="fieldOverlay"
        position="0 0 -0.48"
        width="2" height="2"
        peripheral-field>
      </a-plane>

      <a-entity id="glareOverlay"
        geometry="primitive:plane;width:0.7;height:0.7"
        material="shader:flat;color:#fff;transparent:true;opacity:0"
        position="-0.28 0 -0.5">
      </a-entity>

      <a-entity id="scotoma1"
        geometry="primitive:circle;radius:0.13;segments:32"
        material="shader:flat;color:#111;transparent:true;opacity:0.58"
        position="-0.13 -0.03 -0.42">
      </a-entity>

      <a-entity id="scotoma2"
        geometry="primitive:circle;radius:0.075;segments:32"
        material="shader:flat;color:#222;transparent:true;opacity:0.48"
        position="0.18 0.11 -0.43">
      </a-entity>

    </a-camera>
  </a-entity>

</a-scene>

<script>
const $ = selector => document.querySelector(selector);
const scene = $('a-scene');

let simOn = true;
let useful = 0.5;
let fieldPercent = 100;
let lightingMode = 'day';

/* PROCEDURAL ROOM DETAILS */

function addBox(parent, position, size, color) {
  const el = document.createElement('a-box');

  el.setAttribute('position',position.join(' '));
  el.setAttribute('width',size[0]);
  el.setAttribute('height',size[1]);
  el.setAttribute('depth',size[2]);
  el.setAttribute('color',color);

  parent.appendChild(el);
  return el;
}

function buildRoomDetails() {
  const floor = $('#floorboards');

  for (let x=-3.8;x<4;x+=0.4) {
    addBox(
      floor,
      [x,0.008,0],
      [0.008,0.004,8],
      '#75614f'
    );
  }

  const shelf = $('#shelfBooks');
  const colors = [
    '#8a594c','#486a76','#b1a078',
    '#586b52','#7d6481','#b57a53'
  ];

  for (let row=0;row<3;row++) {
    for (let i=0;i<9;i++) {
      const height=0.22+(i%3)*0.045;

      addBox(
        shelf,
        [-0.48+i*0.115,
          0.19+row*0.62+height/2,
          0],
        [0.085,height,0.29],
        colors[(i+row)%colors.length]
      );
    }
  }
}

/* LIGHTING PRESETS */

const lightingPresets = {
  morning:{
    ambient:0.48,
    ambientColor:'#ffe2c0',
    sun:1.25,
    sunColor:'#ffbb79',
    sunPosition:'-3 2 -1',
    ceiling:0,
    lamp:0,
    window:'#edb875',
    background:'#e5b993',
    shade:'#ddc39c'
  },

  day:{
    ambient:0.85,
    ambientColor:'#ffffff',
    sun:1.1,
    sunColor:'#ffffff',
    sunPosition:'-2 5 -2',
    ceiling:0,
    lamp:0,
    window:'#8db8d0',
    background:'#b8cbd5',
    shade:'#d9c9ad'
  },

  dusk:{
    ambient:0.24,
    ambientColor:'#b7b5d4',
    sun:0.42,
    sunColor:'#ff9865',
    sunPosition:'-3 1 -1',
    ceiling:0,
    lamp:0.25,
    window:'#aa7590',
    background:'#806f90',
    shade:'#e1b984'
  },

  night:{
    ambient:0.10,
    ambientColor:'#9aaccd',
    sun:0.03,
    sunColor:'#a4b8de',
    sunPosition:'-2 4 -2',
    ceiling:0.28,
    lamp:1.15,
    window:'#17243c',
    background:'#111a2b',
    shade:'#ffe0a0'
  }
};

function setLighting(mode) {
  if (!lightingPresets[mode]) return;

  lightingMode=mode;
  const p=lightingPresets[mode];

  $('#ambientLight').setAttribute(
    'light',{
      type:'ambient',
      color:p.ambientColor,
      intensity:p.ambient
    }
  );

  $('#sunLight').setAttribute(
    'light',{
      type:'directional',
      color:p.sunColor,
      intensity:p.sun,
      castShadow:false
    }
  );

  $('#sunLight').setAttribute(
    'position',p.sunPosition
  );

  $('#ceilingLight').setAttribute(
    'light','intensity',p.ceiling
  );

  $('#floorLampLight').setAttribute(
    'light','intensity',p.lamp
  );

  $('#windowGlass').setAttribute(
    'color',p.window
  );

  $('#lampShade').setAttribute(
    'color',p.shade
  );

  if (!scene.is('ar-mode')) {
    scene.setAttribute(
      'background','color',p.background
    );
  }

  $('#lightingStatus').textContent =
    'Lighting: '+mode.charAt(0).toUpperCase()+
    mode.slice(1);
}

/* DISTANCE EFFECT */

AFRAME.registerComponent('vision-target',{
  init:function() {
    this.cameraPosition=new THREE.Vector3();
    this.objectPosition=new THREE.Vector3();
    this.originalMaterials=new Map();

    this.el.object3D.traverse(o=>{
      if (!o.material) return;

      const materials=Array.isArray(o.material)
        ?o.material:[o.material];

      for (const m of materials) {
        if (!this.originalMaterials.has(m)) {
          this.originalMaterials.set(m,{
            opacity:m.opacity,
            transparent:m.transparent
          });
        }
      }
    });
  },

  tick:function() {
    $('#cam').object3D.getWorldPosition(
      this.cameraPosition
    );

    this.el.object3D.getWorldPosition(
      this.objectPosition
    );

    const distance=this.cameraPosition.distanceTo(
      this.objectPosition
    );

    const excess=Math.max(0,distance-useful);
    const factor=simOn
      ?Math.max(0.12,1-excess/2.5)
      :1;

    this.el.object3D.traverse(o=>{
      if (!o.material) return;

      const materials=Array.isArray(o.material)
        ?o.material:[o.material];

      for (const m of materials) {
        if (!this.originalMaterials.has(m)) {
          this.originalMaterials.set(m,{
            opacity:m.opacity,
            transparent:m.transparent
          });
        }

        const original=this.originalMaterials.get(m);
        m.transparent=true;
        m.opacity=original.opacity*factor;
      }
    });
  }
});

/* PERIPHERAL FIELD */

AFRAME.registerComponent('peripheral-field',{
  init:function() {
    this.material=new THREE.ShaderMaterial({
      transparent:true,
      depthTest:false,
      depthWrite:false,
      uniforms:{
        radius:{value:1.5}
      },

      vertexShader:`
        varying vec2 vUv;

        void main() {
          vUv=uv;
          gl_Position=
            projectionMatrix*
            modelViewMatrix*
            vec4(position,1.0);
        }
      `,

      fragmentShader:`
        uniform float radius;
        varying vec2 vUv;

        void main() {
          vec2 p=(vUv-vec2(0.5))*2.0;
          float r=length(p);

          float opacity=
            smoothstep(
              radius-0.10,
              radius+0.12,
              r
            )*0.96;

          gl_FragColor=
            vec4(0.0,0.0,0.0,opacity);
        }
      `
    });

    const install=()=>{
      const mesh=this.el.getObject3D('mesh');
      if (!mesh) return;

      mesh.material=this.material;
      mesh.renderOrder=999;
      mesh.frustumCulled=false;
    };

    this.el.addEventListener('object3dset',install);
    install();
  },

  tick:function() {
    this.material.uniforms.radius.value=
      !simOn || fieldPercent===100
      ?1.5
      :0.12+0.95*(fieldPercent-20)/80;
  },

  remove:function() {
    this.material.dispose();
  }
});

/* SETTINGS */

function syncSettings() {
  $('#field').value=fieldPercent;
  $('#fieldVal').textContent=fieldPercent+'%';

  $('#vrField').setAttribute(
    'value',
    'Peripheral field: '+fieldPercent+'%'
  );

  $('#dist').value=useful.toFixed(1);
  $('#distVal').textContent=useful.toFixed(1)+' m';

  $('#vrDistance').setAttribute(
    'value',
    'Distance: '+useful.toFixed(1)+' m'
  );

  $('#vrGlare').setAttribute(
    'value',
    'Glare: '+(
      $('#glare').checked?'ON':'OFF'
    )
  );

  $('#vrMotion').setAttribute(
    'value',
    'Moving person: '+(
      $('#motion').checked?'ON':'OFF'
    )
  );

  $('#vrSimulation').setAttribute(
    'value',
    simOn?'SIMULATION OFF':'SIMULATION ON'
  );

  $('#toggle').textContent=
    simOn?'Simulation OFF':'Simulation ON';

  $('#status').textContent=
    simOn?'SIMULATION ON':'SIMULATION OFF';

  $('#scotoma1').setAttribute('visible',simOn);
  $('#scotoma2').setAttribute('visible',simOn);

  $('#glareOverlay').setAttribute(
    'material','opacity',
    simOn && $('#glare').checked?0.62:0
  );
}

function applyAction(action) {
  if (action==='distanceDown')
    useful=Math.max(
      0.3,Math.round((useful-0.1)*10)/10
    );

  if (action==='distanceUp')
    useful=Math.min(
      2,Math.round((useful+0.1)*10)/10
    );

  if (action==='fieldDown')
    fieldPercent=Math.max(20,fieldPercent-5);

  if (action==='fieldUp')
    fieldPercent=Math.min(100,fieldPercent+5);

  if (action==='glare')
    $('#glare').checked=!$('#glare').checked;

  if (action==='motion')
    $('#motion').checked=!$('#motion').checked;

  if (action==='simulation')
    simOn=!simOn;

  if (lightingPresets[action] &&
      !scene.is('ar-mode')) {
    setLighting(action);
  }

  syncSettings();
}

/* WRIST TRACKING WITH 2 SECOND GRACE PERIOD */

AFRAME.registerComponent('wrist-follow',{
  init:function() {
    this.wrist=new THREE.Vector3();
    this.cameraRotation=new THREE.Quaternion();
    this.offset=new THREE.Vector3();
    this.lastTracked=0;
    this.hasTracked=false;
  },

  tick:function(time) {
    const panel=$('#wristPanel');

    if (!scene.is('vr-mode') &&
        !scene.is('ar-mode')) {
      panel.object3D.visible=false;
      this.hasTracked=false;
      return;
    }

    const xr=scene.renderer?.xr;
    if (!xr) return;

    const hand=xr.getHand(0);
    const wrist=hand?.joints?.['wrist'];

    if (wrist?.visible) {
      wrist.getWorldPosition(this.wrist);

      $('#cam').object3D.getWorldQuaternion(
        this.cameraRotation
      );

      this.offset.set(0,0.19,0.06);
      this.offset.applyQuaternion(
        this.cameraRotation
      );

      panel.object3D.position.copy(this.wrist)
        .add(this.offset);

      panel.object3D.quaternion.copy(
        this.cameraRotation
      );

      panel.object3D.visible=true;
      this.lastTracked=time;
      this.hasTracked=true;

    } else {
      const elapsed=time-this.lastTracked;

      panel.object3D.visible=
        this.hasTracked && elapsed<2000;
    }
  }
});

/* WRIST FINGERTIP INTERACTION */

AFRAME.registerComponent('finger-button-touch',{
  init:function() {
    this.tip=new THREE.Vector3();
    this.local=new THREE.Vector3();
    this.buttonPosition=new THREE.Vector3();
    this.lastContact='';
    this.controls=[
      ...document.querySelectorAll('.touch-control')
    ];
  },

  tick:function() {
    if (!scene.is('vr-mode') &&
        !scene.is('ar-mode')) return;

    const xr=scene.renderer?.xr;
    if (!xr) return;

    const right=xr.getHand(1);
    const tip=right?.joints?.['index-finger-tip'];
    const panel=$('#wristPanel');

    if (!tip?.visible ||
        !panel.object3D.visible) {
      this.lastContact='';
      return;
    }

    tip.getWorldPosition(this.tip);

    const panelObject=panel.object3D;
    panelObject.updateWorldMatrix(true,false);

    this.local.copy(this.tip);
    panelObject.worldToLocal(this.local);

    let touched='';

    // Coordinates are converted into panel-local space,
    // accounting for the 45% wrist-panel scale.
    if (this.local.z>0.005 &&
        this.local.z<0.14) {

      for (const el of this.controls) {
        // Skip controls inside hidden VR-only groups.
        let parent=el.parentElement;
        let hidden=false;

        while (parent && parent!==panel) {
          if (parent.object3D &&
              !parent.object3D.visible) {
            hidden=true;
            break;
          }
          parent=parent.parentElement;
        }

        if (hidden) continue;

        el.object3D.getWorldPosition(
          this.buttonPosition
        );

        panelObject.worldToLocal(
          this.buttonPosition
        );

        const g=el.getAttribute('geometry');

        if (
          Math.abs(this.local.x-
            this.buttonPosition.x)<g.width/2 &&
          Math.abs(this.local.y-
            this.buttonPosition.y)<g.height/2
        ) {
          touched=el.dataset.action;
          break;
        }
      }
    }

    if (touched && touched!==this.lastContact) {
      applyAction(touched);
    }

    this.lastContact=touched;
  }
});

/* GRABBABLE OBJECTS */

AFRAME.registerComponent('pinch-grabbable',{});

AFRAME.registerComponent('pinch-grab-manager',{
  init:function() {
    this.objects=[
      ...document.querySelectorAll(
        '[pinch-grabbable]'
      )
    ];

    this.holds={left:null,right:null};
    this.wasPinching={left:false,right:false};

    this.tip=new THREE.Vector3();
    this.thumb=new THREE.Vector3();
    this.center=new THREE.Vector3();
    this.world=new THREE.Vector3();
    this.local=new THREE.Vector3();
  },

  release:function(key) {
    const hold=this.holds[key];
    if (!hold) return;

    if (hold.el.id==='near')
      hold.el.setAttribute('color','#e9d84b');

    this.holds[key]=null;
  },

  tick:function() {
    if (!scene.is('vr-mode') ||
        scene.is('ar-mode')) {
      this.release('left');
      this.release('right');
      this.wasPinching.left=false;
      this.wasPinching.right=false;
      return;
    }

    const xr=scene.renderer?.xr;
    if (!xr) return;

    for (let i=0;i<2;i++) {
      const key=i===0?'left':'right';
      const hand=xr.getHand(i);

      const index=
        hand?.joints?.['index-finger-tip'];

      const thumb=
        hand?.joints?.['thumb-tip'];

      if (!index?.visible ||
          !thumb?.visible) {
        this.release(key);
        this.wasPinching[key]=false;
        continue;
      }

      index.getWorldPosition(this.tip);
      thumb.getWorldPosition(this.thumb);

      this.center.copy(this.tip)
        .add(this.thumb)
        .multiplyScalar(0.5);

      const separation=
        this.tip.distanceTo(this.thumb);

      const pinching=separation<0.035;
      const released=separation>0.055;

      const hold=this.holds[key];

      if (hold) {
        if (released) {
          this.release(key);
          this.wasPinching[key]=false;
          continue;
        }

        this.world.copy(this.center)
          .add(hold.offset);

        this.local.copy(this.world);

        hold.el.object3D.parent
          .worldToLocal(this.local);

        hold.el.object3D.position.copy(
          this.local
        );

      } else if (
        pinching &&
        !this.wasPinching[key]
      ) {
        let nearest=null;
        let nearestDistance=0.18;

        for (const el of this.objects) {
          if (
            this.holds.left?.el===el ||
            this.holds.right?.el===el
          ) continue;

          el.object3D.getWorldPosition(
            this.world
          );

          const distance=
            this.center.distanceTo(this.world);

          if (distance<nearestDistance) {
            nearest=el;
            nearestDistance=distance;
          }
        }

        if (nearest) {
          nearest.object3D.getWorldPosition(
            this.world
          );

          this.holds[key]={
            el:nearest,
            offset:this.world.clone()
              .sub(this.center)
          };

          if (nearest.id==='near')
            nearest.setAttribute(
              'color','#fff176'
            );
        }
      }

      this.wasPinching[key]=pinching;
    }
  }
});

/* MOVING PERSON */

AFRAME.registerComponent('moving-person',{
  tick:function(time) {
    if (!$('#motion').checked) return;

    $('#person').object3D.position.x=
      2+Math.sin(time/1600)*0.55;
  }
});

/* MODE HANDLING */

function setEnvironmentMode() {
  const ar=scene.is('ar-mode');
  const vr=scene.is('vr-mode');

  $('#virtualRoom').object3D.visible=!ar;

  $('#modeStatus').textContent=
    ar?'Mixed Reality':
    vr?'Virtual Reality':'Browser preview';

  $('#wristMotionGroup').object3D.visible=!ar;
  $('#wristLightingGroup').object3D.visible=!ar;

  const simulation=$('#wristSimulationGroup');

  if (ar) {
    // Move simulation toggle up into the space
    // previously occupied by VR-only controls.
    simulation.object3D.position.y=0.29;

    $('#wristBackground').setAttribute(
      'height',0.52
    );

    $('#wristBackground').object3D.position.y=
      0.135;

    scene.removeAttribute('background');

  } else {
    simulation.object3D.position.y=0;

    $('#wristBackground').setAttribute(
      'height',0.79
    );

    $('#wristBackground').object3D.position.y=0;

    setLighting(lightingMode);
  }

  if (!ar && !vr) {
    $('#wristPanel').object3D.visible=false;
  }
}

/* XR ENTRY */

async function enterMode(mode) {
  try {
    if (!navigator.xr) {
      alert('WebXR is unavailable.');
      return;
    }

    const sessionType=
      mode==='ar'?'immersive-ar':'immersive-vr';

    const supported=
      await navigator.xr.isSessionSupported(
        sessionType
      );

    if (!supported) {
      alert(mode.toUpperCase()+
        ' is unavailable on this browser.');
      return;
    }

    scene.enterVR(mode==='ar');

  } catch(error) {
    console.error(error);
    alert('Unable to enter '+mode.toUpperCase());
  }
}

$('#enterVR').addEventListener(
  'click',()=>enterMode('vr')
);

$('#enterAR').addEventListener(
  'click',()=>enterMode('ar')
);

scene.addEventListener(
  'enter-vr',setEnvironmentMode
);

scene.addEventListener(
  'exit-vr',setEnvironmentMode
);

scene.addEventListener(
  'enter-ar',setEnvironmentMode
);

scene.addEventListener(
  'exit-ar',setEnvironmentMode
);

scene.addEventListener(
  'loaded',setEnvironmentMode
);

/* BROWSER CONTROLS */

$('#field').addEventListener('input',e=>{
  fieldPercent=Number(e.target.value);
  syncSettings();
});

$('#dist').addEventListener('input',e=>{
  useful=Number(e.target.value);
  syncSettings();
});

$('#glare').addEventListener(
  'change',syncSettings
);

$('#motion').addEventListener(
  'change',syncSettings
);

$('#toggle').addEventListener(
  'click',()=>applyAction('simulation')
);

document.querySelectorAll(
  '[data-light]'
).forEach(button=>{
  button.addEventListener('click',()=>{
    setLighting(button.dataset.light);
  });
});

/* INITIALIZATION */

buildRoomDetails();

scene.setAttribute('wrist-follow','');
scene.setAttribute('finger-button-touch','');
scene.setAttribute('pinch-grab-manager','');
scene.setAttribute('moving-person','');

syncSettings();
setLighting('day');

</script>
</body>
</html>
