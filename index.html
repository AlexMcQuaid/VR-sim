<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Functional Vision Simulation — Quest Prototype</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#fff}
    #panel{position:fixed;z-index:20;left:12px;top:12px;max-width:390px;background:#111e;padding:14px;border-radius:12px}
    button,input{font:inherit} button{padding:10px 12px;margin:4px;border:0;border-radius:8px}
    label{display:block;margin:8px 0}.small{font-size:.85rem;color:#ddd}
    #status{margin-top:8px;font-weight:600}
  </style>
</head>
<body>
<div id="panel">
  <strong>Functional Vision Simulation v1</strong>
  <div class="small">Training approximation, not a literal reconstruction of the person's vision.</div>
  <label>Useful viewing distance: <span id="distVal">0.5 m</span>
    <input id="dist" type="range" min="0.3" max="2.0" value="0.5" step="0.1">
  </label>
  <label><input id="glare" type="checkbox"> Strong glare</label>
  <label><input id="motion" type="checkbox" checked> Moving person</label>
  <button id="toggle">Show normal vision</button>
  <div id="status">SIMULATION ON</div>
  <div class="small">In Quest Browser, use the VR button at the bottom-right of the scene.</div>
</div>

<a-scene renderer="antialias: true; colorManagement: true" background="color:#d9d4ca" xr-mode-ui="enabled: true">
  <a-assets>
    <a-mixin id="wall" material="roughness:1"></a-mixin>
  </a-assets>

  <a-entity light="type:ambient; intensity:0.75"></a-entity>
  <a-entity light="type:directional; intensity:0.7" position="-2 4 2"></a-entity>

  <a-plane rotation="-90 0 0" width="8" height="8" color="#9b8d78"></a-plane>
  <a-plane position="0 2 -4" width="8" height="4" color="#ded8cd"></a-plane>
  <a-plane position="-4 2 0" rotation="0 90 0" width="8" height="4" color="#d4cec3"></a-plane>
  <a-plane position="4 2 0" rotation="0 -90 0" width="8" height="4" color="#d4cec3"></a-plane>

  <!-- bright window -->
  <a-plane id="window" position="-2.6 2.2 -3.96" width="1.6" height="1.7"
           material="color:#fff; emissive:#fff; emissiveIntensity:0.7"></a-plane>

  <!-- table and target mug -->
  <a-box position="0 0.72 -2.25" width="2.2" height="0.12" depth="0.9" color="#6f4f35"></a-box>
  <a-box position="-0.85 0.35 -2.25" width="0.12" height="0.7" depth="0.12" color="#59402f"></a-box>
  <a-box position="0.85 0.35 -2.25" width="0.12" height="0.7" depth="0.12" color="#59402f"></a-box>
  <a-cylinder id="mug" position="0.25 0.91 -2.25" radius="0.11" height="0.28" color="#f4f1e9"
              vision-target="label: mug"></a-cylinder>

  <!-- high contrast communication card -->
  <a-box id="card" position="-0.45 0.87 -2.22" width="0.34" height="0.03" depth="0.24" color="#111"
         vision-target="label: communication card"></a-box>

  <!-- moving person surrogate -->
  <a-entity id="person" position="2 0 -3" vision-target="label: person">
    <a-sphere position="0 1.65 0" radius="0.2" color="#8b6f61"></a-sphere>
    <a-cylinder position="0 0.95 0" radius="0.28" height="1.15" color="#42546b"></a-cylinder>
  </a-entity>

  <!-- near object to demonstrate usable close vision -->
  <a-box id="near" position="-0.35 1.25 -0.55" width="0.16" height="0.16" depth="0.16" color="#e9d84b"
         vision-target="label: close object"></a-box>

  <a-entity id="rig" position="0 0 0">
    <a-camera id="cam" position="0 1.6 0" look-controls wasd-controls>
      <a-entity id="glareOverlay" geometry="primitive:plane;width:0.7;height:0.7"
                material="shader:flat;color:#fff;transparent:true;opacity:0"
                position="-0.28 0 -0.5"></a-entity>
      <a-entity id="scotoma1" geometry="primitive:circle;radius:0.13;segments:32"
                material="shader:flat;color:#111;transparent:true;opacity:0.58"
                position="-0.13 -0.03 -0.42"></a-entity>
      <a-entity id="scotoma2" geometry="primitive:circle;radius:0.075;segments:32"
                material="shader:flat;color:#222;transparent:true;opacity:0.48"
                position="0.18 0.11 -0.43"></a-entity>
      <a-entity id="note" position="0 -0.25 -0.65"
                text="value: SIMULATION;align:center;width:0.8;color:#fff"></a-entity>
    </a-camera>
  </a-entity>
</a-scene>

<script>
let simOn=true, useful=0.5, phase=0;
const $=s=>document.querySelector(s);
const scene=$('a-scene');

AFRAME.registerComponent('vision-target',{
  schema:{label:{default:'object'}},
  tick:function(){
    if(!simOn){ this.el.object3D.visible=true; return; }
    const cam=$('#cam').object3D;
    const p1=new THREE.Vector3(), p2=new THREE.Vector3();
    cam.getWorldPosition(p1); this.el.object3D.getWorldPosition(p2);
    const d=p1.distanceTo(p2);
    // Approximate functional consequence: detail/recognition fades progressively beyond useful distance.
    const excess=Math.max(0,d-useful);
    const visibility=Math.max(0.12,1-excess/2.5);
    this.el.object3D.traverse(o=>{
      if(o.material){
        o.material.transparent=true;
        o.material.opacity=visibility;
      }
    });
  }
});

$('#dist').addEventListener('input',e=>{
  useful=parseFloat(e.target.value);
  $('#distVal').textContent=useful.toFixed(1)+' m';
});
$('#glare').addEventListener('change',e=>{
  $('#glareOverlay').setAttribute('material','opacity',e.target.checked && simOn ? 0.62 : 0);
});
$('#toggle').addEventListener('click',()=>{
  simOn=!simOn;
  $('#scotoma1').setAttribute('visible',simOn);
  $('#scotoma2').setAttribute('visible',simOn);
  $('#note').setAttribute('visible',simOn);
  $('#glareOverlay').setAttribute('material','opacity',$('#glare').checked && simOn ? 0.62 : 0);
  $('#toggle').textContent=simOn?'Show normal vision':'Show simulation';
  $('#status').textContent=simOn?'SIMULATION ON':'NORMAL COMPARISON';
});

scene.addEventListener('loaded',()=>{
  function animate(t){
    if($('#motion').checked){
      phase=t/1600;
      $('#person').object3D.position.x=Math.sin(phase)*1.8;
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
});
</script>
</body>
</html>
