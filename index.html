
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Functional Vision Simulator v7.2</title>
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
<style>
  body {margin:0;background:#111;color:white;font-family:system-ui,sans-serif}
  #panel {
    position:fixed;top:12px;left:12px;z-index:20;
    background:#111e;border-radius:12px;padding:14px;
    max-width:370px
  }
  label {display:block;margin:9px 0}
  button,input {font:inherit}
  button {padding:9px;border:0;border-radius:7px}
  .small {font-size:0.85rem;color:#ddd;margin-top:8px}
</style>
</head>
<body>

<div id="panel">
  <strong>Functional Vision Simulator v7.2</strong>
  <div class="small">VR / Mixed Reality wrist controls</div>

  <label>
    Useful viewing distance:
    <span id="distVal">0.5 m</span>
    <input id="dist" type="range"
      min="0.3" max="2" step="0.1" value="0.5">
  </label>

  <label>
    Peripheral field:
    <span id="fieldVal">100%</span>
    <input id="field" type="range"
      min="20" max="100" step="5" value="100">
  </label>

  <label>
    <input id="glare" type="checkbox"> Strong glare
  </label>

  <label>
    <input id="motion" type="checkbox" checked>
    Moving person
  </label>

  <button id="toggle">Show normal vision</button>

  <div id="status">SIMULATION ON</div>
  <div id="modeStatus" class="small">Browser preview</div>
  <div id="handStatus" class="small">Waiting for XR</div>

  <div class="small">
    In VR or MR, raise your left wrist.
    Use your right index finger to touch the wrist controls.
  </div>
</div>

<a-scene
  renderer="antialias:true; colorManagement:true; alpha:true"
  background="color:#d9d4ca"
  xr-mode-ui="enabled:true; XRMode: ar"
  webxr="optionalFeatures: hand-tracking, local-floor, bounded-floor">

  <!-- VIRTUAL ROOM: VR ONLY -->
  <a-entity id="virtualRoom">
    <a-entity light="type:ambient;intensity:0.75"></a-entity>
    <a-entity light="type:directional;intensity:0.7"
      position="-2 4 2"></a-entity>

    <a-plane rotation="-90 0 0" width="8" height="8"
      color="#9b8d78"></a-plane>
    <a-plane position="0 2 -4" width="8" height="4"
      color="#ded8cd"></a-plane>
    <a-plane position="-4 2 0" rotation="0 90 0"
      width="8" height="4" color="#d4cec3"></a-plane>
    <a-plane position="4 2 0" rotation="0 -90 0"
      width="8" height="4" color="#d4cec3"></a-plane>

    <a-plane position="-2.6 2.2 -3.96"
      width="1.6" height="1.7"
      material="color:#fff;emissive:#fff;emissiveIntensity:0.7">
    </a-plane>

    <a-box position="0 0.72 -2.25"
      width="2.2" height="0.12" depth="0.9"
      color="#6f4f35"></a-box>

    <a-box position="-0.85 0.35 -2.25"
      width="0.12" height="0.7" depth="0.12"
      color="#59402f"></a-box>

    <a-box position="0.85 0.35 -2.25"
      width="0.12" height="0.7" depth="0.12"
      color="#59402f"></a-box>

    <a-cylinder id="mug"
      position="0.25 0.91 -2.25"
      radius="0.11" height="0.28"
      color="#f4f1e9"
      vision-target pinch-grabbable>
    </a-cylinder>

    <a-box id="card"
      position="-0.45 0.87 -2.22"
      width="0.34" height="0.03" depth="0.24"
      color="#111" vision-target>
    </a-box>

    <a-entity id="person" position="2 0 -3"
      vision-target>
      <a-sphere position="0 1.65 0"
        radius="0.2" color="#8b6f61"></a-sphere>
      <a-cylinder position="0 0.95 0"
        radius="0.28" height="1.15"
        color="#42546b"></a-cylinder>
    </a-entity>

    <a-box id="near"
      position="-0.35 1.25 -0.55"
      width="0.16" height="0.16" depth="0.16"
      color="#e9d84b"
      vision-target pinch-grabbable>
    </a-box>
  </a-entity>

  <!-- SOUND PANEL: VR ONLY -->
  <a-entity id="buttonStation" position="0.65 1.37 -0.95">
    <a-box width="0.70" height="0.49"
      depth="0.055" color="#293443"></a-box>

    <a-text value="TOUCH A BUTTON"
      align="center" width="0.65"
      position="0 0.195 0.034"
      color="#fff"></a-text>

    <a-box class="sound-button" sound-key="index:0"
      position="-0.21 0.065 0.048"
      width="0.145" height="0.115" depth="0.04"
      color="#d45b55"></a-box>

    <a-box class="sound-button" sound-key="index:1"
      position="0 0.065 0.048"
      width="0.145" height="0.115" depth="0.04"
      color="#e0aa43"></a-box>

    <a-box class="sound-button" sound-key="index:2"
      position="0.21 0.065 0.048"
      width="0.145" height="0.115" depth="0.04"
      color="#60b77c"></a-box>

    <a-box class="sound-button" sound-key="index:3"
      position="-0.21 -0.095 0.048"
      width="0.145" height="0.115" depth="0.04"
      color="#5b9bd5"></a-box>

    <a-box class="sound-button" sound-key="index:4"
      position="0 -0.095 0.048"
      width="0.145" height="0.115" depth="0.04"
      color="#9c75d5"></a-box>

    <a-box class="sound-button" sound-key="index:5"
      position="0.21 -0.095 0.048"
      width="0.145" height="0.115" depth="0.04"
      color="#d979b4"></a-box>

    <a-text id="buttonFeedback"
      value="Touch a button"
      align="center" width="0.65"
      position="0 -0.207 0.035"
      color="#fff"></a-text>
  </a-entity>

  <!-- WRIST PANEL: VR AND AR -->
  <a-entity id="wristPanel" visible="false" scale="0.45 0.45 0.45">
    <a-box width="0.44" height="0.60"
      depth="0.018" color="#172c3a"
      material="opacity:0.96;transparent:true">
    </a-box>

    <a-text value="VISION CONTROLS"
      position="0 0.253 0.014"
      align="center" width="0.42"
      color="#fff"></a-text>

    <a-text id="vrDistance"
      value="Distance: 0.5 m"
      position="0 0.193 0.014"
      align="center" width="0.40"
      color="#fff"></a-text>

    <a-box class="touch-control"
      data-action="distanceDown"
      position="-0.105 0.139 0.025"
      width="0.16" height="0.07" depth="0.025"
      color="#477bba"></a-box>
    <a-text value="- 0.1m"
      position="-0.105 0.130 0.042"
      align="center" width="0.33"
      color="#fff"></a-text>

    <a-box class="touch-control"
      data-action="distanceUp"
      position="0.105 0.139 0.025"
      width="0.16" height="0.07" depth="0.025"
      color="#477bba"></a-box>
    <a-text value="+ 0.1m"
      position="0.105 0.130 0.042"
      align="center" width="0.33"
      color="#fff"></a-text>

    <a-text id="vrField"
      value="Peripheral field: 100%"
      position="0 0.067 0.014"
      align="center" width="0.40"
      color="#fff"></a-text>

    <a-box class="touch-control"
      data-action="fieldDown"
      position="-0.105 0.010 0.025"
      width="0.16" height="0.07" depth="0.025"
      color="#477bba"></a-box>
    <a-text value="Field -"
      position="-0.105 0.001 0.042"
      align="center" width="0.33"
      color="#fff"></a-text>

    <a-box class="touch-control"
      data-action="fieldUp"
      position="0.105 0.010 0.025"
      width="0.16" height="0.07" depth="0.025"
      color="#477bba"></a-box>
    <a-text value="Field +"
      position="0.105 0.001 0.042"
      align="center" width="0.33"
      color="#fff"></a-text>

    <a-box class="touch-control"
      data-action="glare"
      position="0 -0.080 0.025"
      width="0.36" height="0.065" depth="0.025"
      color="#536b78"></a-box>
    <a-text id="vrGlare"
      value="Glare: OFF"
      position="0 -0.089 0.042"
      align="center" width="0.39"
      color="#fff"></a-text>

    <a-box class="touch-control"
      data-action="motion"
      position="0 -0.161 0.025"
      width="0.36" height="0.065" depth="0.025"
      color="#536b78"></a-box>
    <a-text id="vrMotion"
      value="Moving person: ON"
      position="0 -0.170 0.042"
      align="center" width="0.39"
      color="#fff"></a-text>

    <a-box class="touch-control"
      data-action="simulation"
      position="0 -0.244 0.025"
      width="0.36" height="0.065" depth="0.025"
      color="#a34e4e"></a-box>
    <a-text id="vrSimulation"
      value="NORMAL VISION"
      position="0 -0.253 0.042"
      align="center" width="0.39"
      color="#fff"></a-text>
  </a-entity>

  <!-- HAND TRACKING -->
  <a-entity id="leftHand"
    hand-tracking-controls="hand:left;modelStyle:mesh">
  </a-entity>
  <a-entity id="rightHand"
    hand-tracking-controls="hand:right;modelStyle:mesh">
  </a-entity>

  <!-- VISION OVERLAYS -->
  <a-entity id="rig">
    <a-camera id="cam"
      position="0 1.6 0"
      look-controls wasd-controls>

      <a-plane id="fieldOverlay"
        position="0 0 -0.48"
        width="2" height="2"
        peripheral-field>
      </a-plane>

      <a-entity id="glareOverlay"
        geometry="primitive:plane;width:0.7;height:0.7"
        material="shader:flat;color:#fff;transparent:true;opacity:0"
        position="-0.28 0 -0.5">
      </a-entity>

      <a-entity id="scotoma1"
        geometry="primitive:circle;radius:0.13;segments:32"
        material="shader:flat;color:#111;transparent:true;opacity:0.58"
        position="-0.13 -0.03 -0.42">
      </a-entity>

      <a-entity id="scotoma2"
        geometry="primitive:circle;radius:0.075;segments:32"
        material="shader:flat;color:#222;transparent:true;opacity:0.48"
        position="0.18 0.11 -0.43">
      </a-entity>
    </a-camera>
  </a-entity>
</a-scene>

<script>
const $ = s => document.querySelector(s);
const scene = $('a-scene');

let simOn = true;
let useful = 0.5;
let fieldPercent = 100;

/* ORIGINAL DISTANCE SIMULATION */
AFRAME.registerComponent('vision-target', {
  tick: function() {
    const cam = $('#cam').object3D;
    const a = new THREE.Vector3();
    const b = new THREE.Vector3();

    cam.getWorldPosition(a);
    this.el.object3D.getWorldPosition(b);

    const excess = Math.max(0, a.distanceTo(b) - useful);
    const opacity = simOn
      ? Math.max(0.12, 1 - excess / 2.5)
      : 1;

    this.el.object3D.traverse(o => {
      if (o.material) {
        o.material.transparent = true;
        o.material.opacity = opacity;
      }
    });
  }
});

/* PERIPHERAL FIELD SHADER */
AFRAME.registerComponent('peripheral-field', {
  init: function() {
    this.material = new THREE.ShaderMaterial({
      transparent: true,
      depthTest: false,
      depthWrite: false,
      uniforms: {radius:{value:1.5}},
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv=uv;
          gl_Position=projectionMatrix*
            modelViewMatrix*vec4(position,1.0);
        }
      `,
      fragmentShader: `
        uniform float radius;
        varying vec2 vUv;
        void main() {
          vec2 p=(vUv-vec2(0.5))*2.0;
          float r=length(p);
          float opacity=
            smoothstep(radius-0.10,radius+0.12,r)*0.96;
          gl_FragColor=vec4(0.0,0.0,0.0,opacity);
        }
      `
    });

    const install = () => {
      const mesh = this.el.getObject3D('mesh');
      if (!mesh) return;
      mesh.material = this.material;
      mesh.renderOrder = 999;
      mesh.frustumCulled = false;
    };

    this.el.addEventListener('object3dset', install);
    install();
  },
  tick: function() {
    this.material.uniforms.radius.value =
      !simOn || fieldPercent === 100
      ? 1.5
      : 0.12 + 0.95 * (fieldPercent-20)/80;
  },
  remove: function() {
    this.material.dispose();
  }
});

/* SETTINGS */
function syncSettings() {
  $('#field').value = fieldPercent;
  $('#fieldVal').textContent = fieldPercent + '%';
  $('#vrField').setAttribute(
    'value', 'Peripheral field: ' + fieldPercent + '%'
  );

  $('#dist').value = useful.toFixed(1);
  $('#distVal').textContent = useful.toFixed(1) + ' m';
  $('#vrDistance').setAttribute(
    'value', 'Distance: ' + useful.toFixed(1) + ' m'
  );

  $('#vrGlare').setAttribute(
    'value', 'Glare: ' +
    ($('#glare').checked ? 'ON' : 'OFF')
  );

  $('#vrMotion').setAttribute(
    'value', 'Moving person: ' +
    ($('#motion').checked ? 'ON' : 'OFF')
  );

  $('#vrSimulation').setAttribute(
    'value', simOn ? 'NORMAL VISION' : 'RESTORE SIMULATION'
  );

  $('#toggle').textContent =
    simOn ? 'Show normal vision' : 'Show simulation';

  $('#status').textContent =
    simOn ? 'SIMULATION ON' : 'NORMAL COMPARISON';

  $('#scotoma1').setAttribute('visible', simOn);
  $('#scotoma2').setAttribute('visible', simOn);

  $('#glareOverlay').setAttribute(
    'material', 'opacity',
    simOn && $('#glare').checked ? 0.62 : 0
  );
}

function applyAction(action) {
  if (action === 'distanceDown')
    useful = Math.max(0.3, Math.round((useful-0.1)*10)/10);

  if (action === 'distanceUp')
    useful = Math.min(2, Math.round((useful+0.1)*10)/10);

  if (action === 'fieldDown')
    fieldPercent = Math.max(20, fieldPercent-5);

  if (action === 'fieldUp')
    fieldPercent = Math.min(100, fieldPercent+5);

  if (action === 'glare')
    $('#glare').checked = !$('#glare').checked;

  if (action === 'motion')
    $('#motion').checked = !$('#motion').checked;

  if (action === 'simulation')
    simOn = !simOn;

  syncSettings();
}

/* WRIST POSITION TRACKING
   Follows the left wrist and faces the headset.
   Uses actual XR joint positions, not the visible mesh.
*/
AFRAME.registerComponent('wrist-follow', {
  init: function() {
    this.wrist = new THREE.Vector3();
    this.cameraPosition = new THREE.Vector3();
    this.cameraRotation = new THREE.Quaternion();
    this.offset = new THREE.Vector3();
  },

  tick: function() {
    const panel = $('#wristPanel');

    if (!scene.is('vr-mode') && !scene.is('ar-mode')) {
      panel.object3D.visible = false;
      return;
    }

    const xr = scene.renderer && scene.renderer.xr;
    if (!xr) return;

    const hand = xr.getHand(0);
    const wrist = hand && hand.joints && hand.joints['wrist'];

    if (!wrist || !wrist.visible) {
      panel.object3D.visible = false;
      return;
    }

    wrist.getWorldPosition(this.wrist);

    const camera = $('#cam').object3D;
    camera.getWorldPosition(this.cameraPosition);
    camera.getWorldQuaternion(this.cameraRotation);

    // Move the panel above the wrist and slightly
    // toward the headset for fingertip accessibility.
    this.offset.set(0, 0.19, 0.06);
    this.offset.applyQuaternion(this.cameraRotation);

    panel.object3D.position.copy(this.wrist).add(this.offset);
    panel.object3D.quaternion.copy(this.cameraRotation);
    panel.object3D.visible = true;
  }
});

/* FINGERTIP BUTTON DETECTION
   Only the right index finger operates wrist controls.
*/
AFRAME.registerComponent('finger-button-touch', {
  init: function() {
    this.tip = new THREE.Vector3();
    this.local = new THREE.Vector3();
    this.lastContact = '';
    this.lastSound = '';
    this.lastStatus = '';

    document.querySelectorAll('.touch-control').forEach(el => {
      el.addEventListener('click', () =>
        applyAction(el.dataset.action)
      );
    });
  },

  tick: function() {
    if (!scene.is('vr-mode') && !scene.is('ar-mode'))
      return;

    const xr = scene.renderer && scene.renderer.xr;
    if (!xr) return;

    const right = xr.getHand(1);
    const tip = right && right.joints &&
      right.joints['index-finger-tip'];

    const panel = $('#wristPanel');

    if (!tip || !tip.visible || !panel.object3D.visible) {
      this.lastContact = '';
      return;
    }

    tip.getWorldPosition(this.tip);

    const panelObject = panel.object3D;
    panelObject.updateWorldMatrix(true, false);

    this.local.copy(this.tip);
    panelObject.worldToLocal(this.local);

    let touched = '';

    // Only accept touches near the front of the panel.
    if (this.local.z > 0.005 && this.local.z < 0.10) {
      const controls = [
        ...document.querySelectorAll('.touch-control')
      ];

      for (let i=0; i<controls.length; i++) {
        const el = controls[i];
        const p = el.object3D.position;
        const g = el.getAttribute('geometry');

        if (
          Math.abs(this.local.x-p.x) < g.width/2 &&
          Math.abs(this.local.y-p.y) < g.height/2
        ) {
          touched = el.dataset.action;
          break;
        }
      }
    }

    if (touched && touched !== this.lastContact) {
      applyAction(touched);
    }

    this.lastContact = touched;

    const message = 'Right hand tracked; wrist controls active';

    if (message !== this.lastStatus) {
      $('#handStatus').textContent = message;
      this.lastStatus = message;
    }
  }
});

/* ORIGINAL SOUND BUTTONS */
const frequencies = [
  261.63,293.66,329.63,349.23,392,440
];

let audioContext = null;

function playTone(index) {
  try {
    const AudioCtx =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioCtx) return;
    if (!audioContext) audioContext = new AudioCtx();

    if (audioContext.state === 'suspended')
      audioContext.resume().catch(() => {});

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const now = audioContext.currentTime;

    oscillator.type = 'sine';
    oscillator.frequency.value = frequencies[index];

    gain.gain.setValueAtTime(0.0001,now);
    gain.gain.exponentialRampToValueAtTime(0.14,now+0.018);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+0.35);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(now);
    oscillator.stop(now+0.37);
  } catch(e) {
    console.warn(e);
  }
}

AFRAME.registerComponent('sound-key', {
  schema: {index:{type:'int'}},
  init: function() {
    this.baseColor = this.el.getAttribute('color');
    this.cooldown = 0;
    this.el.addEventListener('click', () => this.activate());
  },
  activate: function() {
    if (performance.now() < this.cooldown) return;

    this.cooldown = performance.now()+300;
    playTone(this.data.index);
    this.el.setAttribute('color','#fff');

    $('#buttonFeedback').setAttribute(
      'value','Button '+(this.data.index+1)
    );

    setTimeout(() =>
      this.el.setAttribute('color',this.baseColor),180
    );
  }
});

/* SOUND BUTTON TOUCH: VR ONLY */
AFRAME.registerComponent('sound-touch', {
  init: function() {
    this.tip = new THREE.Vector3();
    this.local = new THREE.Vector3();
    this.contact = {left:'',right:''};
  },
  tick: function() {
    if (!scene.is('vr-mode') || scene.is('ar-mode'))
      return;

    const xr = scene.renderer && scene.renderer.xr;
    if (!xr) return;

    const station = $('#buttonStation').object3D;
    station.updateWorldMatrix(true,false);

    for (let i=0; i<2; i++) {
      const key = i===0 ? 'left' : 'right';
      const hand = xr.getHand(i);
      const joint = hand && hand.joints &&
        hand.joints['index-finger-tip'];

      if (!joint || !joint.visible) {
        this.contact[key] = '';
        continue;
      }

      joint.getWorldPosition(this.tip);
      this.local.copy(this.tip);
      station.worldToLocal(this.local);

      let touched = '';

      if (this.local.z > 0.012 && this.local.z < 0.125) {
        const buttons = [
          ...document.querySelectorAll('.sound-button')
        ];

        for (let j=0; j<buttons.length; j++) {
          const p = buttons[j].object3D.position;
          const g = buttons[j].getAttribute('geometry');

          if (
            Math.abs(this.local.x-p.x) < g.width/2 &&
            Math.abs(this.local.y-p.y) < g.height/2
          ) {
            touched = String(j);
            if (touched !== this.contact[key])
              buttons[j].components['sound-key'].activate();
            break;
          }
        }
      }

      this.contact[key] = touched;
    }
  }
});

/* PINCH-TO-GRAB: VR ONLY */
AFRAME.registerComponent('pinch-grabbable', {});

AFRAME.registerComponent('pinch-grab-manager', {
  init: function() {
    this.objects = [
      ...document.querySelectorAll('[pinch-grabbable]')
    ];

    this.holds = {left:null,right:null};
    this.wasPinching = {left:false,right:false};

    this.tip = new THREE.Vector3();
    this.thumb = new THREE.Vector3();
    this.center = new THREE.Vector3();
    this.world = new THREE.Vector3();
    this.local = new THREE.Vector3();
  },

  release: function(key) {
    const hold = this.holds[key];
    if (!hold) return;

    if (hold.el.id === 'near')
      hold.el.setAttribute('color','#e9d84b');

    this.holds[key] = null;
  },

  tick: function() {
    if (!scene.is('vr-mode') || scene.is('ar-mode')) {
      this.release('left');
      this.release('right');
      this.wasPinching.left = false;
      this.wasPinching.right = false;
      return;
    }

    const xr = scene.renderer && scene.renderer.xr;
    if (!xr) return;

    for (let i=0; i<2; i++) {
      const key = i===0 ? 'left' : 'right';
      const hand = xr.getHand(i);
      const index = hand && hand.joints &&
        hand.joints['index-finger-tip'];
      const thumb = hand && hand.joints &&
        hand.joints['thumb-tip'];

      if (!index || !thumb ||
          !index.visible || !thumb.visible) {
        this.release(key);
        this.wasPinching[key] = false;
        continue;
      }

      index.getWorldPosition(this.tip);
      thumb.getWorldPosition(this.thumb);

      this.center.copy(this.tip)
        .add(this.thumb).multiplyScalar(0.5);

      const separation = this.tip.distanceTo(this.thumb);
      const pinching = separation < 0.035;
      const released = separation > 0.055;

      const hold = this.holds[key];

      if (hold) {
        if (released) {
          this.release(key);
          this.wasPinching[key] = false;
          continue;
        }

        this.world.copy(this.center).add(hold.offset);
        this.local.copy(this.world);

        hold.el.object3D.parent.worldToLocal(this.local);
        hold.el.object3D.position.copy(this.local);

      } else if (pinching && !this.wasPinching[key]) {
        let nearest = null;
        let nearestDistance = 0.18;

        for (const el of this.objects) {
          if (
            this.holds.left?.el === el ||
            this.holds.right?.el === el
          ) continue;

          el.object3D.getWorldPosition(this.world);
          const d = this.center.distanceTo(this.world);

          if (d < nearestDistance) {
            nearest = el;
            nearestDistance = d;
          }
        }

        if (nearest) {
          nearest.object3D.getWorldPosition(this.world);
          this.holds[key] = {
            el:nearest,
            offset:this.world.clone().sub(this.center)
          };

          if (nearest.id === 'near')
            nearest.setAttribute('color','#fff176');
        }
      }

      this.wasPinching[key] = pinching;
    }
  }
});

/* MOVING PERSON */
AFRAME.registerComponent('moving-person', {
  tick: function(time) {
    if (!$('#motion').checked) return;
    $('#person').object3D.position.x =
      Math.sin(time/1600)*1.8;
  }
});

/* MODE HANDLING */
function setEnvironmentMode() {
  const ar = scene.is('ar-mode');
  const vr = scene.is('vr-mode');

  $('#virtualRoom').object3D.visible = !ar;
  $('#buttonStation').object3D.visible = !ar;

  $('#modeStatus').textContent =
    ar ? 'Mixed Reality' :
    vr ? 'Virtual Reality' : 'Browser preview';

  if (ar) {
    scene.removeAttribute('background');
  } else {
    scene.setAttribute('background','color','#d9d4ca');
  }

  if (!ar && !vr)
    $('#wristPanel').object3D.visible = false;
}

scene.addEventListener('enter-ar',setEnvironmentMode);
scene.addEventListener('exit-ar',setEnvironmentMode);
scene.addEventListener('enter-vr',setEnvironmentMode);
scene.addEventListener('exit-vr',setEnvironmentMode);
scene.addEventListener('loaded',setEnvironmentMode);

/* BROWSER CONTROLS */
$('#field').addEventListener('input',e => {
  fieldPercent = Number(e.target.value);
  syncSettings();
});

$('#dist').addEventListener('input',e => {
  useful = Number(e.target.value);
  syncSettings();
});

$('#glare').addEventListener('change',syncSettings);
$('#motion').addEventListener('change',syncSettings);
$('#toggle').addEventListener('click',() =>
  applyAction('simulation')
);

/* ACTIVATE SYSTEMS */
scene.setAttribute('wrist-follow','');
scene.setAttribute('finger-button-touch','');
scene.setAttribute('sound-touch','');
scene.setAttribute('pinch-grab-manager','');
scene.setAttribute('moving-person','');

syncSettings();
</script>
